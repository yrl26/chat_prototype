<script>
    //-------------Old System-------------//
/*
setTimeout or setInterval for checking chat inactivity
first paramater is function without parenthesis. ie: setInterval(test, 2000);

foreach loop -> for of loop(JS)
*/

let currentUserId = null;
let currentActiveChat = null;
let currentRecipientId = null;
let lastMessageId = 0;
let events = null;
let lastNotificationPoll = Date.now();
let poll = null;
let token = null;

function chatController(){
    sendMessage(currentActiveChat, currentUserId);
}

async function setSystemsAndParameters(userId){
    const response = await fetch("http://192.168.1.68/chat_prototype/Backend/findOrCreateChat.php",
        {
            method: "POST",
            headers: {
                "Content-Type":"application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
                currentUser: currentUserId,
                chatMemberId: userId
            })
        }
    )
    const data = await response.json();
    currentActiveChat = data.chat_id;
    currentRecipientId = userId;

    if(poll != null){
        clearInterval(poll);
    }

    poll = setInterval(
    () => {
        getNewMessages(currentUserId, currentActiveChat, lastNotificationPoll);
    }, 5000);

    getMessages(currentActiveChat);
}

async function sendMessage(chatId){
    const messageInput = document.getElementById("message-input").value;
    const response = await fetch("http://192.168.1.68/chat_prototype/Backend/sendMessage.php",
        {
            method: "POST",
            headers: {
                "Content-Type":"application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
                chat: chatId,
                user: currentUserId,
                recipient: currentRecipientId,
                message: messageInput
            })
        }
    )
    const data = await response.json();
    console.log(data);
}

async function getMessages(chatId){
    const response = await fetch(`http://192.168.1.68/chat_prototype/Backend/getChatMessages.php?chatId=${currentActiveChat}`,
        {
            method: "GET",
            headers:{
                "Authorization": `Bearer ${token}`
            }
        }
    );
    const data = await response.json();
    if(data.length > 0){
        createLine(data);
        lastMessageId = data[data.length - 1].id;
        console.log("last chat id is: " + lastMessageId);
    }
    else{
        console.log("No Messages!");
    }
    if(events == null){
        console.log("Current chat: " + currentActiveChat);
        openChatStream(currentActiveChat, lastMessageId);
    }
}

                "Authorization": `Bearer ${token}`

    const data = await response.json();
    
    if(data.status == "success"){
        authSuccess = true;
        sseAuthToken = data.sseToken;

//Old function
async function createNewChat(userId){
    const response = await fetch("http://192.168.1.68/chat_prototype/Backend/createNewChat.php",
        {
            method: "POST",
            headers: {
                "Content-Type":"application/json" 
            },
            body: JSON.stringify({
                currentUser: currentUserId,
                user: userId
            })
        }
    )
    const data = await response.json();
    console.log(data);
}

/*This needs to update when the user changes active chat*/
async function getNewMessages(currentUser, currentActiveChat, lastNotificationPoll){
    console.log("Current poll time: " + lastNotificationPoll);
    const response = await fetch(`http://192.168.1.68/chat_prototype/Backend/checkNewMessages.php?currentUser=${currentUser}&currentChat=${currentActiveChat}&lastPoll=${lastNotificationPoll}`);
    const data = await response.json();
    if(data.message){
        console.log(data.message);
    }
    else{
        console.log(data);
        appendToNotificationTab(data);
        lastNotificationPoll = Date.now();

        if(poll != null){
        clearInterval(poll);
        }
        poll = setInterval(
        () => {
            getNewMessages(currentUserId, currentActiveChat, lastNotificationPoll);
        }, 5000);
    }
    
}


async function setCurrentUserAndNewMessagePoll(){
    currentUserId = document.getElementById("user").value;
    console.log("Current user is: " + currentUserId);
    //console.log("Current chat: " + currentActiveChat);
    const response = await fetch("http://192.168.1.68/chat_prototype/Backend/tokenGenerator.php",{
        method: "GET",
        headers:{
            "userId": currentUserId
        }
    });

    token = await response.json();
    appendToTokenTab(token);

    /*poll = setInterval(
    () => {
        getNewMessages(currentUserId, currentActiveChat, lastNotificationPoll);
    }, 5000);*/
}

function createLine(data){
    chatList = document.getElementById("chat");
    for(element of data){
        li = document.createElement("li");
        li.innerHTML = element.id +" "+ element.message;
        chatList.appendChild(li);
    }
}

function appendToNotificationTab(data){
    const notificationTab = document.getElementById("notification");
    for(element of data){
        li = document.createElement("li");
        li.innerHTML = "Received message from: " + element.user_id;
        notificationTab.appendChild(li);
    }
}

function appendToTokenTab(token){
    tokenTab = document.getElementById("token");
    tokenTab.innerHTML = token;
}
</script>
